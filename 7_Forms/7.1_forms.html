<!DOCTYPE html>
<html>
<head>
    <title>Forms</title>
    <link href="7.1_styles.css" rel="stylesheet"></a>
</head>
<body>
    <h1 class="header">Forms</h1>
    <form>
        <p class="questions"> How many siblings do you have?</p>
        <input type="radio" name="siblingCount" id="halfSibling" value="1/2">
        <label for="halfSibling">1/2</label><br>
        <input type="radio" name="siblingCount" id="oneSibling" value="1">
        <label for="oneSibling">1</label><br>
        <input type="radio" name="siblingCount" id="twoSiblings" value="2">
        <label for="twoSiblings">2</label><br>
        <input type="radio" name="siblingCount" id="noSiblings" value="none">
        <label for="noSiblings">None</label><br><br>

        <p class="questions">Which sports do you play? If so, which ones?</p>
        <input type="checkbox" id="skiing" name="skiing" value="Skiing">
        <label for="skiing">ALPINE Skiing</label><br>
        <input type="checkbox" id="figureskating" name="figureskating" value="Figure skating">
        <label for="figureskating">Figure Skating</label><br>
        <input type="checkbox" id="sailing" name="sailing" value="Sailing">
        <label for="sailing">Sailing</label><br>
        <input type="checkbox" id="soccer" name="soccer" value="Soccer">
        <label for="soccer">Soccer</label><br>
        <input type="checkbox" id="basketball" name="basketball" value="Basketball">
        <label for="basketball">Basketball</label><br>
        <input type="checkbox" id="swimming" name="swimming" value="Swimming">
        <label for="swimming">Swimming and Diving</label><br>
        <input type="checkbox" id="cricket" name="cricket" value="Cricket">
        <label for="cricket">Cricket</label><br>
        <input type="checkbox" id="running" name="running" value="Running">
        <label for="running">Running</label><br>
        <input type="checkbox" id="lacrosse" name="lacrosse" value="Lacrosse">
        <label for="lacrosse">Lacrosse</label><br>
        <input type="checkbox" id="none" name="none" value="None">
        <label for="none">None of the Above</label>
        <br><br>

        <p class="questions">When is your birthday?</p>
        <label for="month">Month:</label>
        <select name="month" id="month">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
        <label for="day">Day:</label>
        <select name="day" id="day">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">30</option>
            <option value="31">31</option>
        </select>

        <p class="questions">Do you or any family members speak another language besides English? If so, what language?</p>
        <input type="text" id="language" name="language"><br><br>

        <p class="questions">Have you ever been to a zoo, museum, or farm? Select one.</p>
        <input type="radio" name="place" id="zoo" value="Zoo">
        <label for="zoo">Zoo</label><br>
        <input type="radio" name="place" id="museum" value="Museum">
        <label for="museum">Museum</label><br>
        <input type="radio" name="place" id="farm" value="Farm">
        <label for="farm">Farm</label><br><br>

        <input type="submit" value="submit" action-page="7.1_forms.html">
    </form>
</body>
</html>
