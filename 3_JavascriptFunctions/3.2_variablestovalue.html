<html>
<head>
	<title>Variables to Value</title>
	<style>
		body {
			background-color:slateblue;
		}
		p {
			color:lavender
		}
		h2 {
			color: lavenderblush
		}
	</style>
</head>
<body>
	<h2 >JavaScript Variables</h2>
	<p>In this example, x, y, and z are variables.</p>
	<p id="demo"></p>
<script>
	var x = 100123412374;
	var y = 1234230;
	var z = x + y;
	document.getElementById("demo").innerHTML ="The value of z is: " + z;
</script>
</body>
</html>
