<html>
<head>
	<title>The Confirm Button</title>
    <style>
body {
    background-color: lightskyblue
}
button {
    background-color: steelblue;
    color: white;
    padding: 12px 28px;
    text-align: center;
    text-decoration:dashed;
    font-size: 20px;
}
</style>
</head>
<body style="text-align: center">
<h1 style="font-family: Bradley Hand">The Confirm Button</h1>
<button onclick="myFunction()" style="font-family: optima">Try it</button>
<p style="font-family: optima"id="demo"></p>
<script>
function myFunction() {
 var txt;
  if (confirm("Press a button!")) {
	txt = "You pressed OK!";
} else {
	txt = "You pressed Cancel!";
 }
document.getElementById("demo").innerHTML = txt;
}
</script>
</body>
</html>
