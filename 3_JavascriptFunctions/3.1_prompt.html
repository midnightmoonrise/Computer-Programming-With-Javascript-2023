<html>
<head>
<title>Eyes of My Pet</title>
</head>
<body>
<style>
    body {
        background-color: lightskyblue
    }
    button {
        background-color: steelblue;
        color: white;
        padding: 12px 28px;
        text-align: center;
        text-decoration:dashed;
        font-size: 20px;
        font-family: optima;
    }
</style>
<h1 style="font-family: Bradley hand; text-align: center">Eyes of My Pet</h1>
<button onclick="myFunction()">Try it</button>
<p style="font-family: optima"id="demo"></p>
<script>
function myFunction() {
var txt;
var pet = prompt("Please enter your pet's name:", "");
  if (pet == null || pet == "") {
	 txt = "User cancelled the prompt.";
} else {
	 txt = "Hello " + pet + "! How are you today?";
	}
document.getElementById("demo").innerHTML = txt;
}
</script>

</body>
</html>
